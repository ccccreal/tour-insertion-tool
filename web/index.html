<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour Insertion Tool</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside>
      <label><span>Sprache · Langue · Language</span>
        <select id="language">
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>

      <h2 data-i18n="settings"></h2>
      <label><span data-i18n="profile"></span><select id="profile"></select></label>
      <label><span data-i18n="speed"></span><input id="speed" type="number" min="5" max="40" step="0.5"></label>
      <label><span data-i18n="detour"></span><input id="detour" type="number" min="1" max="2.5" step="0.05"></label>
      <label><span data-i18n="service"></span><input id="service" type="number" min="0" max="60" step="1"></label>
      <label><span data-i18n="tolerance"></span><input id="tolerance" type="number" min="0" max="120" step="1"></label>
      <label class="check"><input id="optimize" type="checkbox">
        <span data-i18n="optimize"></span>
        <span class="help" id="optimize-help" tabindex="0">?</span></label>
      <details class="box">
        <summary data-i18n="advanced"></summary>
        <label class="check"><input id="open-start" type="checkbox"> <span data-i18n="open_start"></span></label>
        <label class="check"><input id="open-end" type="checkbox"> <span data-i18n="open_end"></span></label>
        <label><span data-i18n="min_score"></span><input id="min-score" type="number" min="0" max="1" step="0.05"></label>
      </details>
      <p class="note" data-i18n="demo_note"></p>
    </aside>

    <main>
      <h1 data-i18n="title"></h1>
      <p data-i18n="intro"></p>

      <p class="label" data-i18n="data"></p>
      <div id="sources" class="sources"></div>

      <div id="upload-box">
        <div class="uploads">
          <label class="upload"><span data-i18n="tours_file"></span>
            <input type="file" id="tours-file" accept=".csv,text/csv"></label>
          <label class="upload"><span data-i18n="orders_file"></span>
            <input type="file" id="orders-file" accept=".csv,text/csv"></label>
        </div>
        <details class="box">
          <summary data-i18n="templates"></summary>
          <p><a href="api/templates/tours" data-i18n="template_tours"></a> ·
             <a href="api/templates/orders" data-i18n="template_orders"></a></p>
        </details>
      </div>

      <button id="run" class="primary" type="button" data-i18n="run"></button>
      <div id="error" class="error" hidden></div>

      <div id="metrics" class="metrics" hidden></div>
      <div id="warnings"></div>

      <div class="map-head">
        <h2 data-i18n="map"></h2>
        <span class="muted small" data-i18n="drag_hint"></span>
        <button id="undo" type="button" data-i18n="undo" disabled></button>
      </div>
      <div id="map"></div>
      <p class="small muted" data-i18n="assumptions"></p>

      <div id="results" hidden>
        <div id="tables"></div>
        <h2 data-i18n="downloads"></h2>
        <div id="downloads" class="downloads"></div>
      </div>
      <div id="toast" class="toast" hidden></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
