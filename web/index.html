<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour Insertion Tool</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside>
      <label><span>Sprache · Langue · Language</span>
        <select id="language">
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>

      <h2 data-i18n="settings"></h2>
      <label><span data-i18n="profile"></span><select id="profile"></select></label>

      <h3 data-i18n="sec_depot"></h3>
      <label><span data-i18n="depot_label"></span>
        <input id="depot" type="text" placeholder="Bahnhofplatz 1, 8001 Zürich"></label>
      <label><span data-i18n="start_at"></span>
        <select id="start-at">
          <option value="depot" data-i18n="start_depot"></option>
          <option value="first" data-i18n="start_first"></option>
        </select></label>
      <label><span data-i18n="end_at"></span>
        <select id="end-at">
          <option value="depot" data-i18n="end_depot_opt"></option>
          <option value="place" data-i18n="end_place_opt"></option>
          <option value="open" data-i18n="end_open_opt"></option>
        </select></label>
      <label id="end-place-box" hidden><span data-i18n="end_place_label"></span>
        <input id="end-place" type="text" placeholder="Bahnhof Oberwinterthur, 8404 Winterthur"></label>
      <div class="two">
        <label><span data-i18n="day_start"></span><input id="day-start" type="time" value="08:00"></label>
        <label><span id="day-end-label" data-i18n="day_end"></span><input id="day-end" type="time"></label>
      </div>
      <p class="small muted" data-i18n="depot_help"></p>

      <h3 data-i18n="vehicles"></h3>
      <table class="vehicles">
        <thead><tr><th data-i18n="v_name"></th><th class="only-new" data-i18n="v_count"></th><th data-i18n="v_capacity"></th><th data-i18n="v_speed"></th><th></th></tr></thead>
        <tbody id="vehicles"></tbody>
        <tfoot><tr class="v-default">
          <td data-i18n="v_default"></td><td class="only-new"></td><td class="muted">–</td>
          <td><input id="speed" type="number" min="5" max="60" step="0.5"></td><td></td>
        </tr></tfoot>
      </table>
      <button type="button" id="add-vehicle" class="small-button" data-i18n="v_add"></button>
      <label class="check only-new"><input id="vehicle-priority" type="checkbox">
        <span data-i18n="vehicle_priority"></span></label>
      <p class="small muted" data-i18n="vehicles_help"></p>

      <h3 data-i18n="sec_travel"></h3>
      <label><span data-i18n="detour"></span><input id="detour" type="number" min="1" max="2.5" step="0.05"></label>

      <h3 data-i18n="sec_stops"></h3>
      <label><span data-i18n="service"></span><input id="service" type="number" min="0" max="60" step="1"></label>
      <label><span data-i18n="tolerance"></span><input id="tolerance" type="number" min="0" max="120" step="1"></label>

      <h3 data-i18n="sec_planning"></h3>
      <label class="check"><input id="optimize" type="checkbox">
        <span data-i18n="optimize"></span>
        <span class="help" id="optimize-help" tabindex="0">?</span></label>
      <details class="box">
        <summary data-i18n="advanced"></summary>
        <label><span data-i18n="min_score"></span><input id="min-score" type="number" min="0" max="1" step="0.05"></label>
      </details>
      <p class="note" data-i18n="demo_note"></p>
      <nav id="legal-links" class="legal-links small" hidden></nav>
    </aside>

    <main>
      <h1 data-i18n="title"></h1>
      <p id="intro"></p>

      <div class="modes" role="radiogroup">
        <label class="mode-card"><input type="radio" name="mode" value="new">
          <span><b data-i18n="mode_new"></b><br><span class="small muted" data-i18n="mode_new_help"></span></span></label>
        <label class="mode-card"><input type="radio" name="mode" value="insert">
          <span><b data-i18n="mode_insert"></b><br><span class="small muted" data-i18n="mode_insert_help"></span></span></label>
      </div>

      <p class="label" data-i18n="data"></p>
      <div id="sources" class="sources"></div>

      <div id="upload-box">
        <div class="uploads">
          <label class="upload only-insert"><span data-i18n="tours_file"></span>
            <input type="file" id="tours-file" accept=".csv,text/csv"></label>
          <label class="upload"><span class="only-insert" data-i18n="orders_file"></span>
            <span class="only-new" data-i18n="stops_file"></span>
            <input type="file" id="orders-file" accept=".csv,.xlsx,.xlsm,text/csv"></label>
        </div>
        <details class="box only-insert">
          <summary data-i18n="templates"></summary>
          <p><a href="api/templates/tours" data-i18n="template_tours"></a> ·
             <a href="api/templates/orders" data-i18n="template_orders"></a></p>
        </details>
      </div>

      <div id="mapping" class="mapping" hidden></div>

      <div class="run-row">
        <button id="show-stops" class="secondary only-new" type="button" data-i18n="show_stops"></button>
        <button id="run" class="primary" type="button"></button>
      </div>
      <div id="error" class="error" hidden></div>

      <div id="metrics" class="metrics" hidden></div>
      <div id="warnings"></div>

      <div class="map-head">
        <h2 data-i18n="map"></h2>
        <span class="muted small" data-i18n="drag_hint"></span>
        <button id="undo" type="button" data-i18n="undo" disabled></button>
      </div>
      <div id="handbar" class="handbar" hidden></div>
      <div id="placing" class="placing-banner" hidden></div>
      <div id="map"></div>
      <div id="open"></div>
      <p class="small muted" data-i18n="assumptions"></p>

      <div id="results" hidden>
        <div id="tables"></div>
        <h2 data-i18n="downloads"></h2>
        <div id="downloads" class="downloads"></div>
      </div>
      <div id="toast" class="toast" hidden></div>
      <div id="busy" class="busy" hidden role="status" aria-live="polite">
        <div class="busy-box">
          <div class="spinner" aria-hidden="true"></div>
          <p id="busy-title" class="busy-title"></p>
          <p class="small muted" data-i18n="busy_hint"></p>
          <p id="busy-time" class="small muted busy-time"></p>
        </div>
      </div>
    </main>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
