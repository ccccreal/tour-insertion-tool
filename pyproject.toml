[project]
name = "tour-insertion-tool"
version = "0.1.0"
description = "Insert overnight orders into pre-planned delivery tours (cheapest feasible insertion)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["folium>=0.17", "openpyxl>=3.1"]

[project.optional-dependencies]
app = ["streamlit>=1.45"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
tour-insert = "tour_insertion.cli:main"
tour-insert-server = "tour_insertion.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
